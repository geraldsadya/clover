name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: [8.2, 8.3]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, zip, gd, curl, xml, bcmath, soap, intl, readline, libxml, openssl, pdo_sqlite, sqlite3, pcntl, pdo_pgsql, pgsql, redis, memcached, imagick
        coverage: none
        
    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-
        
    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction
      
    - name: Copy environment file
      run: cp .env.example .env
      
    - name: Generate application key
      run: php artisan key:generate
      
    - name: Create SQLite database
      run: touch database/database.sqlite
      
    - name: Run database migrations
      run: php artisan migrate --force
      
    - name: Run PHPUnit tests
      run: php artisan test
      
    - name: Run PHPStan static analysis
      run: ./vendor/bin/phpstan analyse app/ --level=8 --memory-limit=256M
      
    - name: Run Laravel Pint code style check
      run: ./vendor/bin/pint --test
      
    - name: Run Golden Test Set evaluation
      run: php scripts/eval.php
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE: ${{ secrets.OPENAI_BASE }}
        MODEL: ${{ secrets.MODEL }}
        
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: mbstring, dom, fileinfo, mysql, pdo, pdo_mysql, zip, gd, curl, xml, bcmath, soap, intl, readline, libxml, openssl, pdo_sqlite, sqlite3, pcntl, pdo_pgsql, pgsql, redis, memcached, imagick
        
    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction
      
    - name: Run security audit
      run: composer audit
      
    - name: Check for known security vulnerabilities
      run: |
        if command -v security-checker &> /dev/null; then
          security-checker security:check composer.lock
        else
          echo "Security checker not available, skipping..."
        fi
